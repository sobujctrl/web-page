<!doctype html>
<html lang="bn" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ইউনিফাইড লিড ইনবক্স (Unified Lead Inbox)</title>
    <meta name="description" content="Facebook, Messenger এবং WhatsApp-এর সব লিড এক জায়গায় ম্যানেজ, ফিল্টার ও ট্র্যাক করার আধুনিক বাংলা সিআরএম ও ইনবক্স টুল।" />
    <meta property="og:title" content="ইউনিফাইড লিড ইনবক্স (Unified Lead Inbox)" />
    <meta property="og:description" content="Facebook, Messenger এবং WhatsApp-এর সব লিড এক জায়গায় ম্যানেজ, ফিল্টার ও ট্র্যাক করার আধুনিক বাংলা সিআরএম ও ইনবক্স টুল।" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('unified_lead_dark_mode');
          var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (saved === 'true' || (saved === null && prefersDark)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="h-full bg-slate-50 text-slate-900 antialiased dark:bg-[#0f172a] dark:text-slate-100 selection:bg-blue-500/20 selection:text-blue-600">
    <div id="root" class="h-full"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
